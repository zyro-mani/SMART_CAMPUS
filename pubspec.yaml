name: smart_campus
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI / Splash
  animated_splash_screen: ^1.3.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # Location
  geolocator: ^12.0.0
  google_maps_flutter: ^2.13.1

  # File / CSV / Excel
  file_picker: ^8.1.2
  excel: ^2.1.0
  csv: ^6.0.0

  # Network / Date
  http: ^1.2.1
  intl: ^0.20.2

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.4

  # Other utilities
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1

  # State management
  provider: ^6.1.2

  # Camera / Face verification
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.14.0
  face_verification: ^0.3.8
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  sqflite: 2.4.0
  archive: 4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/campus.png
    - assets/campus_dark.png
    - assets/campus_light.png
    - assets/avatar.png
    - assets/creator.jpg